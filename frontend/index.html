<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- start_url apunta a /subir: al empleado que guarda la página en su pantalla de inicio le
         abre directo la cámara, sin pasar por el dashboard. Ese atajo es todo el "app nativa"
         que este producto necesita.
         Los PNG salen del mismo favicon.svg, renderizados con Chrome sobre fondo blanco: iOS
         ignora los SVG y pinta de negro cualquier transparencia, así que sin un PNG opaco el
         ícono de la pantalla de inicio era una captura borrosa de la página. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2fa0d1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Gastify</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
